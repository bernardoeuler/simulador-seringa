<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extrusão</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <h1 class="so-leitor">Extrusão, Tópicos de Fabricação - UFC</h1>

  <section class="app modo-historia" id="app">
    <div class="stage">
      <canvas id="cena" role="img" aria-label="Seringa com massinha de modelar. Ao apertar, a massinha sai pelo bico no formato escolhido."></canvas>

      <div class="historia" id="historia">
        <div class="h-sala" aria-hidden="true">
          <div class="h-janela"></div>
          <div class="h-quadro"><span>Extrusão</span></div>
          <div class="h-relogio"></div>
          <div class="h-mesa"></div>
        </div>
        <div class="h-chao"></div>
        <div class="boneco" id="aluno" style="--x: 22" role="img" aria-label="Aluno"></div>
        <div class="boneco" id="professor" style="--x: 74" role="img" aria-label="Professor Pedro"></div>
        <div class="balao" id="balao" aria-live="polite">
          <strong class="balao-nome" id="balao-nome"></strong>
          <p class="balao-texto" id="balao-texto"></p>
        </div>
        <div class="h-inicio" id="inicio">
          <p class="h-inicio-titulo">Extrusão, Tópicos de Fabricação - UFC</p>
          <button class="comecar" id="comecar" type="button">COMEÇAR</button>
        </div>
        <div class="h-escolha" id="escolha">
          <p class="h-escolha-titulo">Escolha seu personagem</p>
          <div class="h-escolha-lista" id="lista-alunos"></div>
        </div>
        <div class="h-quiz" id="quiz">
          <div class="quiz-topo">
            <span class="quiz-contagem" id="quiz-contagem"></span>
            <span class="quiz-moedas" id="quiz-moedas" aria-live="polite"><span class="moeda" aria-hidden="true"></span><span id="quiz-moedas-n">0</span></span>
          </div>
          <p class="quiz-enunciado" id="quiz-enunciado"></p>
          <div class="quiz-alternativas" id="quiz-alternativas"></div>
          <div class="quiz-resultado" id="quiz-resultado" role="alertdialog" aria-labelledby="quiz-resultado-texto">
            <span class="quiz-simbolo" id="quiz-simbolo" aria-hidden="true"></span>
            <p class="quiz-resultado-texto" id="quiz-resultado-texto"></p>
            <p class="quiz-ganho" id="quiz-ganho"></p>
            <div class="quiz-botoes">
              <button class="btn-grande" id="quiz-seguir" type="button"></button>
              <button class="btn-grande secundario" id="quiz-simulador" type="button" hidden>Usar o simulador</button>
            </div>
          </div>
        </div>
        <div class="h-acao">
          <button class="btn-grande" id="ir-perguntas" type="button" hidden>Responder perguntas</button>
          <button class="btn-grande" id="ir-simulador" type="button" hidden>Ir para o simulador</button>
        </div>
      </div>
      <button class="avancar" id="avancar" type="button" aria-label="Próxima fala" title="Próxima fala (seta para a direita)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l8 7-8 7z M16 5h2.5v14H16z" fill="currentColor"/></svg>
      </button>
      <button class="voz" id="voz" type="button" aria-pressed="true" aria-label="Desligar som" title="Desligar som">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
          <g class="voz-on" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></g>
          <g class="voz-off" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 9l5 6M21 9l-5 6"/></g>
        </svg>
      </button>
    </div>

    <div class="guia" id="guia">
      <div class="guia-avatar" id="guia-avatar" aria-hidden="true"></div>
      <p class="guia-texto"><strong>Prof. Pedro:</strong> <span id="guia-texto"></span></p>
      <button class="btn primary" id="voltar-historia" type="button">Continuar a história</button>
    </div>

    <div class="controls">
      <div class="group">
        <h2>Bico da seringa</h2>
        <div class="chips" id="bicos"></div>
      </div>
      <div class="group">
        <h2>Cor da massinha</h2>
        <div class="swatches" id="cores"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="apertar" type="button">Segure para apertar</button>
        <button class="btn" id="frente" type="button" aria-pressed="false">Ver de frente</button>
        <button class="btn" id="encher" type="button">Encher de novo</button>
        <button class="btn" id="tela" type="button">Tela cheia</button>
      </div>
    </div>
  </section>
</main>
<script src="script.js"></script>
<script src="historia.js"></script>
</body>
</html>
